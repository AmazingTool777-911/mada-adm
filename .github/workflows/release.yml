name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: Publish a GitHub release
        default: false

permissions:
  contents: write

jobs:
  call-deno-compile:
    if: ${{ github.event.inputs.release == 'true' }}
    uses: ./.github/workflows/deno.yml

  publish:
    needs: call-deno-compile
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: mada-adm-binaries
          path: bin/

      - name: Zip binaries
        run: |
          # Create zips for each architecture
          zip -j ./bin/linux-x86_64.zip ./bin/x86_64-unknown-linux-gnu/mada-adm
          zip -j ./bin/linux-aarch64.zip ./bin/aarch64-unknown-linux-gnu/mada-adm
          zip -j ./bin/macos-x86_64.zip ./bin/x86_64-apple-darwin/mada-adm
          zip -j ./bin/macos-aarch64.zip ./bin/aarch64-apple-darwin/mada-adm
          zip -j ./bin/windows-x86_64.zip ./bin/x86_64-pc-windows-msvc/mada-adm.exe

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            ./bin/linux-x86_64.zip \
            ./bin/linux-aarch64.zip \
            ./bin/macos-x86_64.zip \
            ./bin/macos-aarch64.zip \
            ./bin/windows-x86_64.zip \
            --title "Mada ADM CLI ${{ github.ref_name }}" \
            --notes "Seeding and managing Madagascar's administrative boundary data."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

info:
  name: Get commune by id
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/communes/{{COMMUNE_ID}}"
  params:
    - name: include_geojson
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: COMMUNE_ID
      value: "5"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

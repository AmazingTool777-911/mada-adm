name: mada-adm

services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
    volumes:
      - ./bin:/app/bin
      - ./commands/.args:/app/commands/.args
      - ./db/.sqlite:/app/db/.sqlite
      - ./db/.pki:/app/db/.pki
      - ./redis/.pki:/app/redis/.pki
    depends_on:
      - redis
    networks:
      - mada-adm-network

  redis:
    image: redis:alpine3.23
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - mada-adm-network

volumes:
  redis-data:

networks:
  mada-adm-network:

info:
  name: Get the fokontany of a location
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/locations/{{LAT}}/{{LNG}}/fokontany"
  params:
    - name: include_geojson
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  variables:
    - name: LNG
      value: ""
    - name: LAT
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
